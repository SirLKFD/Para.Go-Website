<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Lost - 404 | Para.Go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Styling variables matching design system */
    :root {
      --color-bg: #0c0714;
      --color-surface: #160d24;
      --color-gold: #fcd116;
      --color-text: #ffffff;
      --color-muted: #d1c9db;
    }
    
    /* Global scrollbar and cursor */
    html {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    ::-webkit-scrollbar-button {
      display: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-bg);
      background: radial-gradient(circle at 50% 50%, var(--color-surface) 0%, var(--color-bg) 100%);
      color: var(--color-text);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      box-sizing: border-box;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><circle cx='12' cy='12' r='8' fill='none' stroke='%23fcd116' stroke-width='1.5' stroke-opacity='0.4'/><circle cx='12' cy='12' r='4' fill='%23fcd116'/></svg>") 12 12, auto;
    }

    /* Core container styling */
    .container {
      max-width: 600px;
      padding: 2rem;
      z-index: 10;
    }

    .logo {
      height: 60px;
      width: auto;
      margin-bottom: 2.5rem;
    }

    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 8rem;
      font-weight: 700;
      color: var(--color-gold);
      line-height: 1;
      margin: 0;
      letter-spacing: -0.05em;
      text-shadow: 0 0 30px rgba(252, 209, 22, 0.2);
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.25rem;
      font-weight: 600;
      margin: 1rem 0 1.5rem 0;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--color-muted);
      font-size: 1.125rem;
      line-height: 1.6;
      margin: 0 0 2.5rem 0;
    }

    .btn {
      display: inline-block;
      background-color: var(--color-gold);
      color: #0c0714;
      padding: 0.875rem 2rem;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: background-color 150ms ease, transform 150ms ease;
      cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><circle cx='14' cy='14' r='10' fill='none' stroke='%23fcd116' stroke-width='2' stroke-opacity='0.7'/><circle cx='14' cy='14' r='5' fill='%23fcd116'/></svg>") 14 14, pointer;
    }

    .btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
    }

    /* Ambient background grid */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(45, 24, 71, 0.1) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(45, 24, 71, 0.1) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <img src="/parago-icon.png" alt="Para.Go Logo" class="logo">
    <h2 class="error-code">404</h2>
    <h1>Jeepney Route Deviation</h1>
    <p>Oops! The jeepney took an unscheduled detour and ended up off the mapped grid. This page doesn't exist.</p>
    <a href="/" class="btn">Back to Safe Transit</a>
  </div>
</body>
</html>
